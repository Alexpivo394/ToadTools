name: Compile solution

on:
  push:
    branches:
      - '*'
  pull_request:

jobs:
  windows:
    name: windows-2025
    runs-on: windows-2025
    steps:

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cache packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      # Тесты подключения и плагина «Коллизии» без Revit: под .NET 10 (Revit 2025+) и .NET Framework 4.8 (Revit 2020–2024)
      - name: Test ToadTools (net10.0)
        run: dotnet run --project source/ToadTools.Tests -c Release -f net10.0-windows

      - name: Test ToadTools (net48)
        run: dotnet run --project source/ToadTools.Tests -c Release -f net48

      - name: Compile solution
        run: dotnet run -c Release
        working-directory: "build"
        env:
          DOTNET_ENVIRONMENT: ${{ github.ref_name == 'main' && 'Production' || 'Development' }}