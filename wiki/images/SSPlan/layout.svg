<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .panel { fill: #f8fafc; stroke: #e2e8f0; }
    .h { font-size: 15px; font-weight: 600; fill: #0f172a; }
    .s { font-size: 12px; fill: #64748b; }
    .t { font-size: 11px; fill: #0f172a; }
    .cam { fill: #ffffff; stroke: #0f172a; stroke-width: 1.5; }
    .dim { stroke: #dc2626; stroke-width: 1; }
    .ax { stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 3; }
    .lbl { font-size: 12px; fill: #dc2626; }
  </style>
  <defs>
    <g id="cam">
      <rect class="cam" x="-22" y="-16" width="44" height="32" rx="3"/>
      <path d="M-10 -4 h14 l8 -5 v18 l-8 -5 h-14 z" fill="#0f172a"/>
    </g>
  </defs>
  <rect width="960" height="250" fill="#ffffff"/>
  <g transform="translate(10,10)">
    <rect class="panel" width="940" height="230" rx="10"/>
    <text class="h" x="16" y="28">Чертёжный вид: одна аннотация на каждую цепь панели</text>
    <path class="ax" d="M40 150 H590 M40 60 V200"/>
    <circle cx="40" cy="150" r="3" fill="#94a3b8"/><text class="s" x="46" y="214">начало вида (0; 0)</text>
    <use href="#cam" x="140" y="150"/><use href="#cam" x="240" y="150"/><use href="#cam" x="340" y="150"/><use href="#cam" x="440" y="150"/><use href="#cam" x="540" y="150"/>
    <text class="t" x="124" y="186">гр. 1</text><text class="t" x="224" y="186">гр. 2</text><text class="t" x="324" y="186">гр. 3</text><text class="t" x="424" y="186">гр. 4</text><text class="t" x="524" y="186">гр. 5</text>
    <path class="dim" d="M140 112 V124 M240 112 V124 M140 118 H240"/><text class="lbl" x="166" y="108">X = 25</text>
    <path class="dim" d="M40 112 V124 M140 112 V124 M40 118 H140"/><text class="lbl" x="66" y="108">X = 25</text>
    <text class="s" x="620" y="140">Каждая следующая аннотация сдвигается</text>
    <text class="s" x="620" y="156">на X и Y от предыдущей. Y = 0 — схема</text>
    <text class="s" x="620" y="172">в одну строку, X = 0 и Y ≠ 0 — в столбец.</text>
    <text class="s" x="620" y="196">В аннотацию пишутся номер цепи, имя</text>
    <text class="s" x="620" y="212">панели и номер пространства элемента.</text>
  </g>
</svg>
